name: Atualizar fundamentos CVM de ações

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importar DFPs para todo o universo
        run: python scripts/import_cvm_dfp_bulk.py --years 2023 2024 2025
      - name: Importar ITRs mais recentes para todo o universo
        run: python scripts/import_cvm_itr_bulk.py --years 2025 2026
      - name: Salvar dados atualizados
        run: |
          git config user.name "coletor-b3-bot"
          git config user.email "actions@github.com"
          git add data/dfp_import_report.json data/itr_import_report.json data/fundamentals data/quarterly
          git diff --cached --quiet || git commit -m "Atualiza DFP e ITR de ações"
          git push
